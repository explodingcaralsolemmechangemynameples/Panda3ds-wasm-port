<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panda3DS - WebAssembly</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #101014; color: #e8e8ea; font-family: system-ui, sans-serif; overflow: hidden; }
  #canvas { width: 100vw; height: 100vh; display: block; outline: none; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 10, 14, .92); z-index: 10; }
  .panel { max-width: 540px; padding: 28px 32px; background: #1b1b22; border: 1px solid #2e2e3a; border-radius: 12px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { font-size: 13px; color: #9a9aa8; margin: 8px 0; line-height: 1.5; }
  code { background: #26262f; padding: 1px 5px; border-radius: 4px; }
  #pick { display: none; }
  .drop { margin: 14px 0; padding: 20px; border: 2px dashed #3a3a4a; border-radius: 10px; color: #9a9aa8; font-size: 13px; cursor: pointer; }
  .drop.over { border-color: #7a7aff; color: #c8c8ff; }
  button { padding: 10px 24px; font-size: 15px; border: 0; border-radius: 8px; background: #5a5af0; color: #fff; cursor: pointer; }
  button:disabled { background: #33333f; color: #777; cursor: default; }
  #status { min-height: 18px; font-size: 12px; color: #8f8f9c; margin-top: 10px; }
  #stats { position: fixed; top: 8px; left: 8px; z-index: 20; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #7CFF9B; background: rgba(0, 0, 0, .55); padding: 4px 8px; border-radius: 6px; pointer-events: none; white-space: pre; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="stats">FPS --</div>
<div id="overlay">
  <div class="panel">
    <h1>Panda3DS - WebAssembly build</h1>
    <p>Pick a decrypted 3DS ROM (<code>.3ds</code>, <code>.cci</code>, <code>.cxi</code>, <code>.app</code>) or drop it here.</p>
    <div id="drop" class="drop">Click or drop a ROM here</div>
    <input id="pick" type="file" accept=".3ds,.cci,.cxi,.app,.zcci">
    <p><button id="start" disabled>Start</button></p>
    <p>Starting also unlocks audio: browsers only allow sound after a click.</p>
    <div id="status"></div>
  </div>
</div>
<script src="Alber.js?v=38"></script>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const drop = document.getElementById('drop');
  const pick = document.getElementById('pick');
  const start = document.getElementById('start');
  const status = document.getElementById('status');
  const overlay = document.getElementById('overlay');

  // ---- Autopilot (?auto=1): fetch the ROM from the test server, boot it, stream stats to disk
  // and execute input commands handed out by GET /cmd. ?shot=1 additionally allows screenshots
  // (it forces preserveDrawingBuffer, which costs a bit of performance, so it is opt-in).
  const PARAMS = new URLSearchParams(location.search);
  const AUTO = PARAMS.has('auto');
  const SHOT = PARAMS.has('shot');

  // Capture console output so CDP can read warnings the emulator prints (shader compile failures etc).
  window.__log = window.__log || [];
  for (const name of ['log', 'warn', 'error']) {
    const orig = console[name].bind(console);
    console[name] = (...a) => {
      try { window.__log.push(a.map(x => (x && x.message) ? x.message : String(x)).join(' ')); } catch (e) {}
      if (window.__log.length > 400) window.__log.shift();
      orig(...a);
    };
  }

  // Timestamp a context loss so it can be lined up against the operation log above.
  canvas.addEventListener('webglcontextlost', () => {
    window.__log.push('[CTX] lost at ' + performance.now().toFixed(0) + ' ms');
    // If the accelerated path was on, retry once with it off instead of leaving a dead canvas.
    if (window.p3dsForceAccel === 1 && sessionStorage.getItem('p3dsAccelDegraded') !== '1') {
      sessionStorage.setItem('p3dsAccelDegraded', '1');
      const u = new URL(location.href);
      u.searchParams.set('accel', '0');
      location.replace(u.toString());
    }
  });

  if (SHOT) {
    const origGetContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function (type, attrs) {
      if (type === 'webgl2' || type === 'webgl' || type === 'experimental-webgl') {
        attrs = Object.assign({}, attrs || {}, { preserveDrawingBuffer: true });
      }
      return origGetContext.call(this, type, attrs);
    };
  }

  if (AUTO) {
    const autoLog = window.__statsLog || (window.__statsLog = []);
    const realPush = autoLog.push.bind(autoLog);
    autoLog.push = function (line) {
      realPush(line);
      try { fetch('/stats', { method: 'POST', body: String(line) }); } catch (e) {}
    };
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function postShot() {
    if (!SHOT) return Promise.resolve();
    const c = document.getElementById('canvas');
    try { return fetch('/shot', { method: 'POST', body: c.toDataURL('image/png') }); } catch (e) { return Promise.resolve(); }
  }

  function mkKey(type, key, keyCode) {
    const e = new KeyboardEvent(type, { key, bubbles: true, cancelable: true });
    Object.defineProperty(e, 'keyCode', { get: () => keyCode });
    Object.defineProperty(e, 'which', { get: () => keyCode });
    return e;
  }

  const KEYCODES = {
    l: 76, k: 75, o: 79, i: 73, q: 81, p: 80, w: 87, s: 83, d: 68, a: 65,
    Enter: 13, ' ': 32, ArrowUp: 38, ArrowDown: 40, ArrowLeft: 37, ArrowRight: 39,
  };

  async function execCmd(c) {
    if (c.set) { Object.assign(window, c.set); return; }
    if (c.wait) return sleep(c.wait);
    if (c.key) {
      const code = KEYCODES[c.key] || 0;
      document.dispatchEvent(mkKey('keydown', c.key, code));
      await sleep(c.ms || 100);
      document.dispatchEvent(mkKey('keyup', c.key, code));
      return;
    }
    if (c.touch) {
      const cv = document.getElementById('canvas');
      const r = cv.getBoundingClientRect();
      const x = r.left + c.touch[0] * r.width;
      const y = r.top + c.touch[1] * r.height;
      const opts = { clientX: x, clientY: y, button: 0, buttons: 1, bubbles: true, cancelable: true };
      cv.dispatchEvent(new MouseEvent('mousedown', opts));
      await sleep(c.ms || 90);
      cv.dispatchEvent(new MouseEvent('mouseup', Object.assign({}, opts, { buttons: 0 })));
      return;
    }
    if (c.shot) return postShot();
  }

  async function pollCommands() {
    try {
      const r = await fetch('/cmd');
      if (r.ok) {
        const txt = await r.text();
        if (txt && txt.trim() !== '' && txt.trim() !== '[]') {
          const cmds = JSON.parse(txt);
          for (const c of cmds) { await execCmd(c); }
        }
      }
    } catch (e) {}
    setTimeout(pollCommands, 250);
  }

  let romFile = null;
  let emulator = null;
  let started = false;

  status.textContent = 'Loading emulator...';

  function update() {
    start.disabled = !(romFile && emulator) || started;
  }

  function selectFile(file) {
    romFile = file;
    drop.textContent = file.name + ' (' + (file.size / (1024 * 1024)).toFixed(1) + ' MB)';
    update();
  }

  drop.addEventListener('click', () => pick.click());
  pick.addEventListener('change', () => { if (pick.files[0]) selectFile(pick.files[0]); });

  ['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => {
    e.preventDefault();
    drop.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach(ev => window.addEventListener(ev, e => {
    e.preventDefault();
    drop.classList.remove('over');
  }));
  window.addEventListener('drop', e => {
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) selectFile(file);
  });

  // Press F to copy the whole performance log to the clipboard (filled in by the
  // emulator's overlay, one line per second).
  const statsEl = document.getElementById('stats');
  function flashStats(text, ok) {
    if (!statsEl) return;
    statsEl.textContent = text;
    statsEl.style.color = ok ? '#7CFF9B' : '#ff8a8a';
    setTimeout(() => { statsEl.style.color = '#7CFF9B'; }, 1000);
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return Promise.reject(new Error('clipboard API unavailable'));
  }
  window.addEventListener('keydown', e => {
    if ((e.key !== 'f' && e.key !== 'F') || e.ctrlKey || e.metaKey || e.altKey) return;
    const log = window.__statsLog || [];
    if (log.length === 0) { flashStats('no stats yet', false); return; }
    copyText(log.join('\n')).then(
      () => flashStats('copied ' + log.length + ' lines to clipboard', true),
      () => flashStats('copy blocked - allow clipboard access', false)
    );
  });

  // Whether the emulator may use hardware-accelerated PICA shaders. The generated vertex programs are
  // large and some Windows ANGLE/D3D11 setups cannot translate them (which loses the WebGL context),
  // while the OpenGL ANGLE backend handles them fine. Probe once with a real generated shader and fall
  // back to the software path when the driver can't take it. ?accel=0 / ?accel=1 force the choice.
  let accelDecision = null;
  function accelToast(detail) {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#ffd27c;font:14px/1.5 monospace;padding:10px 16px;border-radius:8px;z-index:99;max-width:80vw;text-align:center;pointer-events:none';
    el.textContent = detail;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 12000);
  }
  async function accelFeasible() {
    let gl = null;
    try {
      const c = document.createElement('canvas');
      gl = c.getContext('webgl2', { antialias: false });
      if (!gl) return false;
      const src = await (await fetch('accelprobe.glsl')).text();
      const vs = gl.createShader(gl.VERTEX_SHADER);
      gl.shaderSource(vs, src);
      gl.compileShader(vs);
      if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) return false;
      const fs = gl.createShader(gl.FRAGMENT_SHADER);
      gl.shaderSource(fs, '#version 300 es\nprecision mediump float;\nout vec4 o;\nvoid main(){o=vec4(1);}\n');
      gl.compileShader(fs);
      if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) return false;
      const pr = gl.createProgram();
      gl.attachShader(pr, vs);
      gl.attachShader(pr, fs);
      gl.linkProgram(pr);
      const linked = !!gl.getProgramParameter(pr, gl.LINK_STATUS);
      // ANGLE's D3D11 backend can report LINK_STATUS=true while its HLSL translation actually failed.
      const info = (gl.getProgramInfoLog(pr) || '');
      (window.__log = window.__log || []).push('[ACCEL] probe link=' + linked + ' info=' + info.replace(/\s+/g, ' ').slice(0, 160));
      return linked && !/internal error|D3D shader compilation failed/i.test(info);
    } catch (e) {
      return false;
    } finally {
      try { const lc = gl && gl.getExtension('WEBGL_lose_context'); if (lc) lc.loseContext(); } catch (e) {}
    }
  }
  async function ensureAccelDecision() {
    if (accelDecision !== null) return accelDecision;
    const forced = PARAMS.has('accel') ? PARAMS.get('accel') !== '0' : null;
    if (forced !== null) {
      accelDecision = forced;
    } else if (sessionStorage.getItem('p3dsAccelDegraded') === '1') {
      accelDecision = false;
    } else {
      accelDecision = await accelFeasible();
      if (!accelDecision) {
        accelToast('Fast 3D path unavailable on this graphics driver - using the compatible path. For ~60 fps, launch Chrome with the OpenGL ANGLE backend (chrome://flags > Choose ANGLE graphics backend > OpenGL).');
      }
    }
    window.p3dsForceAccel = accelDecision ? 1 : 0;
    (window.__log = window.__log || []).push('[ACCEL] page decision=' + (accelDecision ? 'on' : 'off') + (forced === null ? ' (probe)' : ' (forced)'));
    return accelDecision;
  }

  Panda3DS({
    canvas,
    locateFile: file => file + '?v=38',
    onAbort: what => {
      status.textContent = 'Emulator stopped: ' + what;
      overlay.style.display = 'flex';
      started = false;
      update();
    },
  }).then(module => {
    emulator = module;

    // Persist config / save data / Mii data across reloads using IndexedDB (Emscripten IDBFS).
    // SDL_GetPrefPath() roots everything at /libsdl/Alber, so we mount there.
    let persistReady = false;
    try {
      module.FS.mkdirTree('/libsdl');
      module.FS.mount(module.FS.filesystems.IDBFS, {}, '/libsdl');
      module.FS.syncfs(true, err => {
        if (err) console.warn('Persisted data load failed:', err);
        persistReady = true;
        status.textContent = 'Emulator ready. Choose a ROM.';
        update();
      });
    } catch (e) {
      console.warn('Persistence unavailable, save data will not survive a reload:', e);
      persistReady = true;
      status.textContent = 'Emulator ready. Choose a ROM.';
      update();
    }

    let persisting = false;
    function persist() {
      if (!persistReady || persisting) return;
      persisting = true;
      module.FS.syncfs(false, () => { persisting = false; });
    }
    setInterval(persist, 5000);
    window.addEventListener('beforeunload', persist);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') persist();
    });

  // Pre-boot experiment flags, applied before the emulator starts so buffer creation sees them.
  if (PARAMS.has('orphan')) window.p3dsStreamBufOrphan = 1;
  if (PARAMS.has('sbskip')) window.p3dsStreamBufSkip = 1;
  if (PARAMS.has('accelco')) window.p3dsAccelCompileOnly = 1;
  // window.p3dsForceAccel is set by ensureAccelDecision() right before the emulator boots.

  if (AUTO) {
      function logEnv() {
        const c = document.getElementById('canvas');
        let renderer = 'unknown';
        try {
          const gl = c.getContext('webgl2') || c.getContext('webgl');
          const dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
          renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : (gl ? gl.getParameter(gl.RENDERER) : 'no-gl');
        } catch (e) { renderer = 'err'; }
        const log = window.__statsLog || (window.__statsLog = []);
        log.push('env: canvas ' + c.width + 'x' + c.height + ' css ' + c.clientWidth + 'x' + c.clientHeight +
                 ' dpr ' + devicePixelRatio + ' viewport ' + window.innerWidth + 'x' + window.innerHeight +
                 ' | gl ' + renderer);
      }

      status.textContent = 'Autopilot: fetching ROM...';
      (async () => {
        try {
          const resp = await fetch('/rom');
          const buf = new Uint8Array(await resp.arrayBuffer());
          emulator.FS.mkdirTree('/roms');
          emulator.FS.writeFile('/roms/auto.cci', buf);
          status.textContent = 'Booting ' + buf.length + ' bytes...';
          await ensureAccelDecision();
          overlay.style.display = 'none';
          try { emulator.callMain(['/roms/auto.cci']); } catch (e) {}
          setTimeout(logEnv, 3000);
          if (SHOT) setTimeout(postShot, 9000);
          pollCommands();
        } catch (e) {
          status.textContent = 'Autopilot ROM fetch failed: ' + e;
        }
      })();
    }

    start.addEventListener('click', async () => {
      if (!romFile || !emulator || started) return;
      started = true;
      start.disabled = true;

      const data = new Uint8Array(await romFile.arrayBuffer());
      const path = '/roms/' + romFile.name.replace(/[^\w.\-]/g, '_');
      try {
        emulator.FS.mkdirTree('/roms');
        emulator.FS.writeFile(path, data);
      } catch (e) {
        status.textContent = 'Failed to stage the ROM: ' + e;
        started = false;
        update();
        return;
      }

      status.textContent = 'Booting...';
      await ensureAccelDecision();
      overlay.style.display = 'none';
      try {
        emulator.callMain([path]);
      } catch (e) {
        // set_main_loop(.., simulate_infinite_loop) unwinds the stack here; expected.
      }

      // Record the rendering setup in the same log F copies, so it travels with the stats.
      setTimeout(() => {
        const c = document.getElementById('canvas');
        let renderer = 'unknown';
        try {
          const gl = c.getContext('webgl2') || c.getContext('webgl');
          const dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
          renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : (gl ? gl.getParameter(gl.RENDERER) : 'no-gl');
        } catch (e) { renderer = 'err'; }
        const log = window.__statsLog || (window.__statsLog = []);
        log.push('env: canvas ' + c.width + 'x' + c.height + ' css ' + c.clientWidth + 'x' + c.clientHeight +
                 ' dpr ' + devicePixelRatio + ' viewport ' + window.innerWidth + 'x' + window.innerHeight +
                 ' | gl ' + renderer);
      }, 2000);
    });
  }, error => {
    status.textContent = 'Failed to initialize the emulator: ' + error;
  });
})();
</script>
</body>
</html>
