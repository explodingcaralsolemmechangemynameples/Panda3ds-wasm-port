<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Panda3DS - WebAssembly (optimized)</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #101014; color: #e8e8ea; font-family: system-ui, sans-serif; overflow: hidden; }
  #wrap { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }
  #canvas {
    /* CSS size = fill viewport; GPU buffer size is capped separately */
    max-width: 100vw; max-height: 100vh;
    width: auto; height: auto;
    object-fit: contain;
    display: block; outline: none;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 10, 14, .92); z-index: 10; }
  .panel { max-width: 540px; padding: 28px 32px; background: #1b1b22; border: 1px solid #2e2e3a; border-radius: 12px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { font-size: 13px; color: #9a9aa8; margin: 8px 0; line-height: 1.5; }
  code { background: #26262f; padding: 1px 5px; border-radius: 4px; }
  #pick { display: none; }
  .drop { margin: 14px 0; padding: 20px; border: 2px dashed #3a3a4a; border-radius: 10px; color: #9a9aa8; font-size: 13px; cursor: pointer; }
  .drop.over { border-color: #7a7aff; color: #c8c8ff; }
  button { padding: 10px 24px; font-size: 15px; border: 0; border-radius: 8px; background: #5a5af0; color: #fff; cursor: pointer; margin: 4px; }
  button:disabled { background: #33333f; color: #777; cursor: default; }
  button.secondary { background: #2e2e3a; }
  #status { min-height: 18px; font-size: 12px; color: #8f8f9c; margin-top: 10px; }
  #stats { position: fixed; top: 8px; left: 8px; z-index: 20; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #7CFF9B; background: rgba(0, 0, 0, .55); padding: 4px 8px; border-radius: 6px; pointer-events: none; white-space: pre; }
  #opts { text-align: left; margin: 12px 0; font-size: 12px; color: #9a9aa8; }
  #opts label { display: block; margin: 4px 0; cursor: pointer; }
  #opts select, #opts input[type=number] { background: #26262f; color: #e8e8ea; border: 1px solid #3a3a4a; border-radius: 4px; padding: 2px 6px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas></div>
<div id="stats">FPS --</div>
<div id="overlay">
  <div class="panel">
    <h1>Panda3DS Web — optimized</h1>
    <p>Pick a decrypted 3DS ROM (<code>.3ds</code>, <code>.cci</code>, <code>.cxi</code>, <code>.app</code>) or drop it here.</p>
    <div id="drop" class="drop">Click or drop a ROM here</div>
    <input id="pick" type="file" accept=".3ds,.cci,.cxi,.app,.zcci">
    <div id="opts">
      <label>Internal scale
        <select id="scale">
          <option value="1">1x (400×480) — fastest</option>
          <option value="2" selected>2x (800×960) — balanced</option>
          <option value="3">3x (1200×1440)</option>
          <option value="4">4x (1600×1920) — heavy</option>
        </select>
      </label>
      <label><input type="checkbox" id="vsync" checked> VSync (cap to display refresh)</label>
      <label><input type="checkbox" id="lowpower"> Low-power mode (half rate when tab hidden)</label>
    </div>
    <p><button id="start" disabled>Start</button></p>
    <p>Starting unlocks audio. Press <code>F</code> to copy FPS log.</p>
    <div id="status"></div>
  </div>
</div>
<script src="Alber.js?v=20"></script>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const drop = document.getElementById('drop');
  const pick = document.getElementById('pick');
  const start = document.getElementById('start');
  const status = document.getElementById('status');
  const overlay = document.getElementById('overlay');
  const scaleSel = document.getElementById('scale');
  const vsyncChk = document.getElementById('vsync');
  const lowpowerChk = document.getElementById('lowpower');

  // Native 3DS dual-screen stack is 400×480 (top 400×240 + bottom 400×240).
  // Never let the GL backbuffer track the full CSS viewport — that was the
  // 2400×1196 kill-switch in the logs.
  const BASE_W = 400;
  const BASE_H = 480;

  let romFile = null;
  let emulator = null;
  let started = false;

  status.textContent = 'Loading emulator...';

  function update() {
    start.disabled = !(romFile && emulator) || started;
  }

  function selectFile(file) {
    romFile = file;
    drop.textContent = file.name + ' (' + (file.size / (1024 * 1024)).toFixed(1) + ' MB)';
    update();
  }

  drop.addEventListener('click', () => pick.click());
  pick.addEventListener('change', () => { if (pick.files[0]) selectFile(pick.files[0]); });

  ['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => {
    e.preventDefault();
    drop.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach(ev => window.addEventListener(ev, e => {
    e.preventDefault();
    drop.classList.remove('over');
  }));
  window.addEventListener('drop', e => {
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) selectFile(file);
  });

  const statsEl = document.getElementById('stats');
  function flashStats(text, ok) {
    if (!statsEl) return;
    statsEl.textContent = text;
    statsEl.style.color = ok ? '#7CFF9B' : '#ff8a8a';
    setTimeout(() => { statsEl.style.color = '#7CFF9B'; }, 1000);
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return Promise.reject(new Error('clipboard API unavailable'));
  }
  window.addEventListener('keydown', e => {
    if ((e.key !== 'f' && e.key !== 'F') || e.ctrlKey || e.metaKey || e.altKey) return;
    const log = window.__statsLog || [];
    if (log.length === 0) { flashStats('no stats yet', false); return; }
    copyText(log.join('\n')).then(
      () => flashStats('copied ' + log.length + ' lines to clipboard', true),
      () => flashStats('copy blocked - allow clipboard access', false)
    );
  });

  // Cap internal resolution and keep CSS display independent.
  function applyResolution(scale) {
    const w = BASE_W * scale;
    const h = BASE_H * scale;
    // Buffer size (GPU cost)
    canvas.width = w;
    canvas.height = h;
    // CSS size: fit viewport while preserving aspect
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const aspect = w / h;
    let cssW = vw, cssH = vw / aspect;
    if (cssH > vh) { cssH = vh; cssW = vh * aspect; }
    canvas.style.width = Math.floor(cssW) + 'px';
    canvas.style.height = Math.floor(cssH) + 'px';
    // Notify SDL/Emscripten of the new buffer size if already running
    if (typeof Module !== 'undefined' && Module.setCanvasSize) {
      try { Module.setCanvasSize(w, h, true); } catch (_) {}
    }
    if (window.SDL && window.SDL.receiveEvent) {
      // force a resize event path some builds listen on
      try {
        window.dispatchEvent(new Event('resize'));
      } catch (_) {}
    }
    return { w, h, cssW: Math.floor(cssW), cssH: Math.floor(cssH) };
  }

  // Apply before wasm boots so the first GL context is already small.
  const initial = applyResolution(parseInt(scaleSel.value, 10) || 2);
  scaleSel.addEventListener('change', () => {
    if (started) return; // lock after start; change requires reload
    applyResolution(parseInt(scaleSel.value, 10) || 2);
  });
  window.addEventListener('resize', () => {
    const s = parseInt(scaleSel.value, 10) || 2;
    applyResolution(s);
  });

  // Pause the main loop when the tab is hidden (huge battery/CPU win).
  document.addEventListener('visibilitychange', () => {
    if (!lowpowerChk.checked) return;
    if (typeof Module === 'undefined' || !Module.pauseMainLoop) return;
    if (document.visibilityState === 'hidden') {
      try { Module.pauseMainLoop(); } catch (_) {}
    } else {
      try { Module.resumeMainLoop(); } catch (_) {}
    }
  });

  Panda3DS({
    canvas,
    locateFile: file => file + '?v=20',
    // Prefer discrete GPU when available
    preinitializedWebGLContext: null,
    onAbort: what => {
      status.textContent = 'Emulator stopped: ' + what;
      overlay.style.display = 'flex';
    },
  }).then(module => {
    emulator = module;
    window.Module = module; // for setCanvasSize / pauseMainLoop

    // Prefer IDBFS for save persistence
    let persistReady = false;
    try {
      module.FS.mkdir('/data');
      module.FS.mount(module.IDBFS, {}, '/data');
      module.FS.syncfs(true, err => {
        if (err) console.warn('IDBFS load failed:', err);
        persistReady = true;
        status.textContent = 'Emulator ready. Choose a ROM.';
        update();
      });
    } catch (e) {
      console.warn('Persistence unavailable:', e);
      persistReady = true;
      status.textContent = 'Emulator ready. Choose a ROM.';
      update();
    }

    let persisting = false;
    function persist() {
      if (!persistReady || persisting) return;
      persisting = true;
      module.FS.syncfs(false, () => { persisting = false; });
    }
    setInterval(persist, 8000);
    window.addEventListener('beforeunload', persist);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') persist();
    });

    start.addEventListener('click', async () => {
      if (!romFile || !emulator || started) return;
      started = true;
      start.disabled = true;
      scaleSel.disabled = true;

      // Re-apply resolution right before boot (guard against any resize).
      const res = applyResolution(parseInt(scaleSel.value, 10) || 2);

      const data = new Uint8Array(await romFile.arrayBuffer());
      const path = '/roms/' + romFile.name.replace(/[^\w.\-]/g, '_');
      try {
        emulator.FS.mkdirTree('/roms');
        emulator.FS.writeFile(path, data);
      } catch (e) {
        status.textContent = 'Failed to stage the ROM: ' + e;
        started = false;
        scaleSel.disabled = false;
        update();
        return;
      }

      status.textContent = 'Booting...';
      overlay.style.display = 'none';
      try {
        emulator.callMain([path]);
      } catch (e) {
        // set_main_loop simulate_infinite_loop unwinds here; expected.
      }

      setTimeout(() => {
        const c = document.getElementById('canvas');
        let renderer = 'unknown';
        try {
          const gl = c.getContext('webgl2') || c.getContext('webgl');
          const dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
          renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : (gl ? gl.getParameter(gl.RENDERER) : 'no-gl');
        } catch (e) { renderer = 'err'; }
        const log = window.__statsLog || (window.__statsLog = []);
        log.push('env: canvas ' + c.width + 'x' + c.height +
                 ' css ' + c.clientWidth + 'x' + c.clientHeight +
                 ' dpr ' + devicePixelRatio +
                 ' viewport ' + window.innerWidth + 'x' + window.innerHeight +
                 ' | scale ' + (parseInt(scaleSel.value, 10) || 2) +
                 ' | gl ' + renderer);
      }, 2000);
    });
  }, error => {
    status.textContent = 'Failed to initialize the emulator: ' + error;
  });
})();
</script>
</body>
</html>
